#.
#The amount of time (in ticks) it takes for the energy mount to cool down
# Default: 500
# Range: > 1
mountCoolDownTime = 500
#.
#The energy capacity of the energy mount
# Default: 500000
# Range: > 1
mountEnergyCapacity = 500000
#.
#The amount of time (in ticks) it takes for the energy mount to charge
# Default: 20
# Range: > 1
mountChargeTime = 20
#.
#The energy cost per Railgun Barrel block
# Default: 20000
# Range: > 1
energyCostPerRailBlock = 20000
#.
#The energy cost per Coilgun Barrel block
# Default: 10000
# Range: > 1
energyCostPerCoilBlock = 10000
#.
#The energy consumption of the laser contraption
# Default: 500
# Range: > 1
laserPowerConsumption = 500
#.
#The range of the laser's beam (in blocks)
# Default: 256
# Range: > 1
laserRange = 256
#.
#The per-hit damage of the laser
# Default: 1
# Range: > 1
laserDamage = 1
#.
#The fire burn time (in seconds) of entities hit by the laser
# Default: 2
# Range: > 1
laserSecondsOfFire = 2
#.
#How long a block takes to break when hit by the beam of the laser
# Default: 10
# Range: > 1
laserBlockBreakThreshold = 10
